name: Merge Gate

# gate/merge is the check octopus-repository-policy requires on the default branch
# (policy/checks-common). This repository has no build; its code is its workflows, so the gate
# lints them (actionlint with shellcheck) and is green only when that succeeded.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: octopusden/octopus-base/.github/workflows/common-workflow-lint.yml@v3.2.0

  gate-merge:
    name: gate/merge
    if: ${{ always() }}
    needs: [ workflow-lint ]
    runs-on: ubuntu-latest
    steps:
      - uses: octopusden/octopus-base/.github/actions/merge-gate@v3.2.0
        with:
          needs: ${{ toJson(needs) }}
